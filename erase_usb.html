<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erase USB · NC Drive</title>
<!-- P11 Erase / Clear USB — runs on its own; links to index.html when it is open (js/link.js). -->
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link href="css/ncdrive.css" rel="stylesheet">
</head>
<body class="toolPage">
<main class="tool page" id="dlgUsb">
  <div class="dh"><a class="brandLink" href="index.html" onclick="openMain();return false;" title="NC Drive main page">NC <span>DRIVE</span></a><h3 id="dlgUsbT">💾 Erase / Clear USB</h3><span class="linkState" id="linkState"></span><button class="ghost mini" id="openMain" title="Open (or go back to) index.html">Open NC Drive</button></div>
  <div class="db">
    <div class="row usbBar"><button class="ghost mini" id="usbPick" title="Add a USB stick (or a folder on it) to the list">Add USB drive…</button><button class="ghost mini" id="usbRefresh" disabled title="List the files on the active drive again">Refresh</button><span class="usbActive" id="usbActive"><span class="muted">No USB drive chosen</span></span></div>
    <div class="usbDrives" id="usbDrives" hidden></div>
    <div class="row usbOpts">
      <span class="optGroup" role="radiogroup" aria-label="Files to list and erase">
        <label class="chk"><input type="radio" name="usbShow" value="all" checked> All files</label>
        <label class="chk"><input type="radio" name="usbShow" value="nc"> Only NC files</label>
        <label class="chk"><input type="radio" name="usbShow" value="dxf"> Only DXF files</label>
        <label class="chk"><input type="radio" name="usbShow" value="other"> Only non-DXF and non-NC files</label>
      </span>
      <label class="chk"><input type="checkbox" id="usbSub" checked> Include sub-folders</label>
      <span class="muted" id="usbCount"></span>
    </div>
    <div class="usbView" id="usbView" hidden>
      <div class="tblWrap" id="usbWrap"><table class="tbl" id="usbTable"></table></div>
      <div class="usbPreview"><div class="pvHead" id="pvHead">Preview</div><pre class="pvBody" id="pvBody"></pre></div>
    </div>
    <div class="note">Only files are erased, never folders. With more than one stick plugged in, add each one and pick the one to work on. If the browser won't let you pick the drive itself, make a folder on the stick (e.g. <span class="mono">NC</span>) and pick that.</div>
  </div>
  <div class="df"><span class="grow" id="usbStatus"></span>
    <button class="danger" id="usbErase" disabled>Erase</button>
    <button class="ghost" id="usbCopy" disabled title="Writes this job's .nc files onto the USB">Copy this job to USB</button></div>
  <div class="usbProg" id="usbProg" hidden><div class="procHead"><span class="procTask" id="usbPTask"></span><span class="procPct mono" id="usbPPct"></span></div><div class="procBar" id="usbBar"><i></i></div></div>
  <pre class="toolLog" id="toolLog" aria-label="Log"></pre>
</main>
<script src="js/common.js"></script>
<script src="js/config.js"></script>
<script src="js/link.js"></script>
<script src="js/folders.js"></script>
<script src="js/p11-usb.js"></script>
<script src="js/tool-page.js"></script>
<script src="js/tool-usb.js"></script>
<script>
/* folder check: this page needs css/ and js/ next to it. If they did not load (page opened on its own, or straight from inside the zip), say so instead of showing a broken screen. */
addEventListener('load', function () {
  var cssOk = !!getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  var jsOk = typeof CONFIG !== 'undefined';
  if (cssOk && jsOk) return;
  var miss = [cssOk ? '' : 'css/ncdrive.css', jsOk ? '' : 'js/ files'].filter(Boolean).join(' and ');
  document.body.style.cssText = 'margin:0;height:100vh;display:grid;place-items:center;background:#03080f;color:#d4f1fb;font:15px/1.6 Segoe UI,system-ui,sans-serif;overflow:auto';
  document.body.innerHTML = '<div style="max-width:620px;padding:28px 32px;border:1px solid #22d3ee;box-shadow:0 0 24px rgba(34,211,238,.3);background:#07121d">'
    + '<h1 style="margin:0 0 10px;font-size:22px;letter-spacing:.12em">NC <span style="color:#ff8a3d">DRIVE</span></h1>'
    + '<p style="margin:0 0 10px;color:#ffb020">This page could not load ' + miss + ', so the screen cannot be drawn.</p>'
    + '<p style="margin:0 0 6px">NC Drive is a folder of files that work together. To open it:</p>'
    + '<ol style="margin:0 0 10px;padding-left:22px"><li>Right-click <b>nc-drive-project.zip</b> and choose <b>Extract All</b> (opening the page from inside the zip does not work).</li>'
    + '<li>Open the extracted <b>nc-drive</b> folder and double-click <b>index.html</b> (Edge or Chrome).</li></ol>'
    + '<p style="margin:0;color:#6d91a6;font-size:13px">Keep index.html, the tool pages and the css and js folders together in that folder.</p></div>';
});
</script>
</body>
</html>
