<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copy to Drive · NC Drive</title>
<!-- P10 Copy Parts to Drive — runs on its own; links to index.html when it is open (js/link.js). -->
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link href="css/ncdrive.css" rel="stylesheet">
</head>
<body class="toolPage">
<main class="tool page" id="dlgCopy">
  <div class="dh"><a class="brandLink" href="index.html" onclick="openMain();return false;" title="NC Drive main page">NC <span>DRIVE</span></a><h3 id="dlgCopyT">📦 Copy Parts to Drive</h3><span class="linkState" id="linkState"></span><button class="ghost mini" id="openMain" title="Open (or go back to) index.html">Open NC Drive</button></div>
  <div class="db"><div class="steps">
    <div class="step"><div class="sn">1</div><div>
      <label class="lb" for="cpSrcTxt">Default drive — where the part files are</label>
      <div class="row"><input class="txt" id="cpSrcTxt" placeholder="e.g. Z:\Components  or  \\server\Parts"><button class="ghost mini" id="cpSrcLocate">Locate…</button><span class="note">shared with NC Search</span></div>
      <div class="chips" id="cpSrcRoots" style="margin-top:6px;"></div></div></div>
    <div class="step"><div class="sn">2</div><div>
      <label class="lb" for="cpDst">Target drive</label>
      <div class="row"><input class="txt" id="cpDst" style="flex:0 0 90px;" value="E:"><button class="ghost mini" id="cpDstPick">Open…</button><span id="cpDstState" style="font-size:12px;"></span></div>
      <label class="chk" style="margin:6px 0 0;"><input type="checkbox" id="cpJobDir"> Put the files in a folder named after the job</label> <input class="txt" id="cpJob" style="flex:0 1 160px;margin-top:4px;" placeholder="job name" title="Filled from NC Drive or the parts list; you can type it"></div></div>
    <div class="step"><div class="sn">3</div><div>
      <label class="lb" for="cpTypes">File types to copy</label>
      <div class="row"><input class="txt" id="cpTypes" value="NC, PDF" placeholder="NC, PDF"><span id="cpTypesNote" style="font-size:12px;"></span></div></div></div>
    <div class="cpCols">
    <div class="step cpCol"><div class="sn">4</div><div class="cpColBody">
      <label class="lb" for="cpParts">Part numbers — read from the PDF</label>
      <div class="drop" id="cpDrop" style="margin:0 0 6px;">Drop the parts-list / work-order PDF here (CSV or text works too), or click to browse</div>
      <input type="file" id="cpFile" accept=".pdf,.csv,.txt,.tsv" hidden>
      <textarea class="ta" id="cpParts" hidden></textarea>
      <div class="cpList" id="cpPartList" aria-label="Part numbers"></div>
      <div class="row cpAddRow"><input class="txt" id="cpAddIn" placeholder="Add part number(s), e.g. 19992 or paste a list"><button class="ghost" id="cpAdd" title="Add to the list (Enter)">+ ADD</button><button class="ghost mini" id="cpClearList" title="Remove every part number (click twice)">Clear list</button></div>
      <div class="row" style="margin-top:4px;"><span class="mono" id="cpCount"></span><span class="note" id="cpListSrc"></span></div></div></div>
    <div class="step cpCol"><div class="sn">5</div><div class="cpColBody">
      <label class="lb">Processed — files copied <span class="mono muted" id="cpDoneCount"></span></label>
      <div class="row"><button id="cpRun">Copy files</button><button class="ghost" id="cpStop" hidden>Stop</button><span class="note">For each part: the newest file of each type. A type that is missing (e.g. no NC) → the part's DXF is copied instead, into the same target drive.</span></div>
      <progress id="cpBar" hidden></progress>
      <div class="tblWrap" id="cpWrap" style="margin-top:8px;"><table class="tbl" id="cpTable"></table></div></div></div>
    </div>
  </div></div>
  <div class="df"><span class="grow" id="cpStatus"></span></div>
  <pre class="toolLog" id="toolLog" aria-label="Log"></pre>
</main>
<script src="js/common.js"></script>
<script src="js/config.js"></script>
<script src="js/link.js"></script>
<script src="js/folders.js"></script>
<script src="js/pdf-reader.js"></script>
<script src="js/p8-search.js"></script>
<script src="js/p9-partslist.js"></script>
<script src="js/p10-copy.js"></script>
<script src="js/tool-page.js"></script>
<script src="js/tool-copy.js"></script>
<script>
/* folder check: this page needs css/ and js/ next to it. If they did not load (page opened on its own, or straight from inside the zip), say so instead of showing a broken screen. */
addEventListener('load', function () {
  var cssOk = !!getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  var jsOk = typeof CONFIG !== 'undefined';
  if (cssOk && jsOk) return;
  var miss = [cssOk ? '' : 'css/ncdrive.css', jsOk ? '' : 'js/ files'].filter(Boolean).join(' and ');
  document.body.style.cssText = 'margin:0;height:100vh;display:grid;place-items:center;background:#03080f;color:#d4f1fb;font:15px/1.6 Segoe UI,system-ui,sans-serif;overflow:auto';
  document.body.innerHTML = '<div style="max-width:620px;padding:28px 32px;border:1px solid #22d3ee;box-shadow:0 0 24px rgba(34,211,238,.3);background:#07121d">'
    + '<h1 style="margin:0 0 10px;font-size:22px;letter-spacing:.12em">NC <span style="color:#ff8a3d">DRIVE</span></h1>'
    + '<p style="margin:0 0 10px;color:#ffb020">This page could not load ' + miss + ', so the screen cannot be drawn.</p>'
    + '<p style="margin:0 0 6px">NC Drive is a folder of files that work together. To open it:</p>'
    + '<ol style="margin:0 0 10px;padding-left:22px"><li>Right-click <b>nc-drive-project.zip</b> and choose <b>Extract All</b> (opening the page from inside the zip does not work).</li>'
    + '<li>Open the extracted <b>nc-drive</b> folder and double-click <b>index.html</b> (Edge or Chrome).</li></ol>'
    + '<p style="margin:0;color:#6d91a6;font-size:13px">Keep index.html, the tool pages and the css and js folders together in that folder.</p></div>';
});
</script>
</body>
</html>
