<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parts List · NC Drive</title>
<!-- P9 PartsList from PDF — runs on its own; links to index.html when it is open (js/link.js). -->
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link href="css/ncdrive.css" rel="stylesheet">
</head>
<body class="toolPage">
<main class="tool page" id="dlgPlist">
  <div class="dh"><a class="brandLink" href="index.html" onclick="openMain();return false;" title="NC Drive main page">NC <span>DRIVE</span></a><h3 id="dlgPlistT">📄 PartsList from PDF</h3><span class="linkState" id="linkState"></span><button class="ghost mini" id="openMain" title="Open (or go back to) index.html">Open NC Drive</button></div>
  <div class="db">
    <div class="drop" id="plDrop" style="margin:0;">Drop a parts-list / work-order PDF here (CSV or text works too), or click to browse</div>
    <input type="file" id="plFile" accept=".pdf,.csv,.txt,.tsv" hidden>
    <div class="row" id="plInfo"></div>
    <div class="tblWrap" id="plWrap" hidden><table class="tbl" id="plTable"></table></div>
    <div class="row" id="plAddRow" hidden><button class="ghost mini" id="plAdd">+ Add a line</button></div>
  </div>
  <div class="df"><span class="grow" id="plStatus"></span>
    <button class="ghost" id="plToCopy" title="Copy these parts' files to a drive">Copy to drive…</button>
    <button class="ghost" id="plApply" disabled title="Set the quantity of every loaded part that is on the list">Set quantities</button>
    <button id="plFind" disabled title="Look up the parts that aren't loaded in your parts folders, load them, then set every quantity">Find &amp; load missing, set quantities</button></div>
  <pre class="toolLog" id="toolLog" aria-label="Log"></pre>
</main>
<script src="js/common.js"></script>
<script src="js/config.js"></script>
<script src="js/link.js"></script>
<script src="js/folders.js"></script>
<script src="js/pdf-reader.js"></script>
<script src="js/p8-search.js"></script>
<script src="js/p9-partslist.js"></script>
<script src="js/tool-page.js"></script>
<script src="js/tool-partslist.js"></script>
<script>
/* folder check: this page needs css/ and js/ next to it. If they did not load (page opened on its own, or straight from inside the zip), say so instead of showing a broken screen. */
addEventListener('load', function () {
  var cssOk = !!getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  var jsOk = typeof CONFIG !== 'undefined';
  if (cssOk && jsOk) return;
  var miss = [cssOk ? '' : 'css/ncdrive.css', jsOk ? '' : 'js/ files'].filter(Boolean).join(' and ');
  document.body.style.cssText = 'margin:0;height:100vh;display:grid;place-items:center;background:#03080f;color:#d4f1fb;font:15px/1.6 Segoe UI,system-ui,sans-serif;overflow:auto';
  document.body.innerHTML = '<div style="max-width:620px;padding:28px 32px;border:1px solid #22d3ee;box-shadow:0 0 24px rgba(34,211,238,.3);background:#07121d">'
    + '<h1 style="margin:0 0 10px;font-size:22px;letter-spacing:.12em">NC <span style="color:#ff8a3d">DRIVE</span></h1>'
    + '<p style="margin:0 0 10px;color:#ffb020">This page could not load ' + miss + ', so the screen cannot be drawn.</p>'
    + '<p style="margin:0 0 6px">NC Drive is a folder of files that work together. To open it:</p>'
    + '<ol style="margin:0 0 10px;padding-left:22px"><li>Right-click <b>nc-drive-project.zip</b> and choose <b>Extract All</b> (opening the page from inside the zip does not work).</li>'
    + '<li>Open the extracted <b>nc-drive</b> folder and double-click <b>index.html</b> (Edge or Chrome).</li></ol>'
    + '<p style="margin:0;color:#6d91a6;font-size:13px">Keep index.html, the tool pages and the css and js folders together in that folder.</p></div>';
});
</script>
</body>
</html>
